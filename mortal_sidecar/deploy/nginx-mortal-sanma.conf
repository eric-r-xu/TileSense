# Inside the site's `server { ... }`, beside the /tilesense/mortal/ block, which
# defines the limits it shares (nginx-mortal-limits.conf). The app's offline
# sanma games call https://<host>/tilesense/mortal-sanma/react.
location /tilesense/mortal-sanma/ {
    limit_req zone=tilesense_mortal burst=10 nodelay;
    limit_conn tilesense_mortal_conn 2;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8791/;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    access_log off;
}
