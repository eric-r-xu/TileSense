# Inside the site's `server { ... }`, next to the /tilesense/mp/ block. The
# app calls https://<host>/tilesense/mortal/react (same origin, so no CORS).
location /tilesense/mortal/ {
    limit_req zone=tilesense_mortal burst=10 nodelay;
    limit_conn tilesense_mortal_conn 2;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8790/;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    access_log off;
}
