# /etc/nginx/conf.d/tilesense-mortal-limits.conf (http context; see
# nginx-mortal.conf). One player asks at most once per decision, so 5 a second
# per address, with a small burst, is generous for play and stops abuse.
limit_req_zone $binary_remote_addr zone=tilesense_mortal:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tilesense_mortal_conn:1m;
