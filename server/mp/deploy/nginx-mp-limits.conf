# /etc/nginx/conf.d/tilesense-mp-limits.conf (http context; see
# nginx-mp.conf). Only the WebSocket upgrade counts as a request, so this caps
# new connections per address, not in-game messages. Eight open connections
# leaves room for four players sharing one home address plus reconnects.
limit_req_zone $binary_remote_addr zone=tilesense_mp:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=tilesense_mp_conn:1m;
