# Paste this ONE block inside the existing `server { ... }` for the site
# (/etc/nginx/sites-available/tilesense), alongside the `/ingest` block from
# ../../deploy/nginx-ingest.conf, above `location / {`.
#
# `nginx -t` must pass, and `curl -sI https://<host>/` must still return the
# game unchanged afterwards. Removing this block + `systemctl reload nginx`
# is a complete rollback. The client connects to
# wss://<host>/tilesense/mp/.

location /tilesense/mp/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    # WebSockets are long-lived; the default proxy_read_timeout would kill an
    # idle-but-connected player mid-game.
    proxy_read_timeout 1h;
    access_log off;
}
