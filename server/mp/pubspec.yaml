name: tilesense_mp
description: >-
  Authoritative multiplayer game server for TileSense: private room codes,
  guest identity, bot fill-in, over WebSocket. Runs the shared mahjong_core
  engine as the single source of truth for both rulesets.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.1
  mahjong_core:
    path: ../../packages/mahjong_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
