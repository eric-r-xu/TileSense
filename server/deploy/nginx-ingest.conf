# Paste this ONE block inside the existing `server { ... }` for the site
# (/etc/nginx/sites-available/tilesense), above `location / {`.
#
# It is the only change to the running web server. `nginx -t` must pass, and
# `curl -sI https://<host>/` must still return the game unchanged afterwards.
# Removing this block + `systemctl reload nginx` is a complete rollback.

location = /ingest {
    proxy_pass http://127.0.0.1:8787/ingest;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
    client_max_body_size 64k;
    access_log off;
}
