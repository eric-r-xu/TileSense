# /etc/nginx/sites-available/analytics.app.ericrxu.com
# Symlink into sites-enabled/, `nginx -t`, reload, then:
#   certbot --nginx -d analytics.app.ericrxu.com
# Certbot rewrites this to add the 443 SSL block and an 80->443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name analytics.app.ericrxu.com;

    # Metabase login is the access control; add `allow <ip>; deny all;` here too
    # if you want to lock it to known networks.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }
}
