# Local Postgres for developing the ingest service.
#   docker compose up -d
#   export DATABASE_URL='postgres://tilesense:devpassword@localhost:5432/tilesense?sslmode=disable'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tilesense
      POSTGRES_USER: tilesense
      POSTGRES_PASSWORD: devpassword
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilesense"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
