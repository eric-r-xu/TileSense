<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Japanese Mahjong Trainer">

  <!-- Without this, mobile Chrome lays the page out at a ~980px virtual width
       and then scales it down, which made the canvas look cramped / off (mobile
       Safari happens to default closer to device-width). Pin it to the device
       and cover the display cutout. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TileSense">
  <link rel="apple-touch-icon" href="icons/Icon-192-v2.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-v2.png"/>

  <title>TileSense</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #042020; /* matches kLetterboxColor so there's no flash */

      /* iOS has ignored user-scalable=no since iOS 10, so Safari's own
         pinch-zoom would otherwise stack on top of the app's — pinch once and
         you zoom twice, with the page able to scroll away from the canvas.
         touch-action tells the browser this element handles its own gestures,
         which leaves the pinch to Flutter. Every iOS browser is WebKit, so this
         covers Chrome and Firefox on iPhone too. Android's Chrome already
         honours user-scalable=no; this is harmless there.

         The app never scrolls the page — it is one fixed canvas — so taking
         the browser's touch gestures away costs nothing. */
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Loading screen: shown from the very first paint until Flutter draws its
       first frame (the engine + main.dart.js can take seconds on a cold
       cache or a slow phone connection, which otherwise looks like a blank
       page). Removed by the script below on `flutter-first-frame`. */
    #ts-loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #042020;
      color: #e9d58f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.25s ease-out;
    }
    #ts-loading.done { opacity: 0; pointer-events: none; }
    #ts-loading .title { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
    #ts-loading .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(233, 213, 143, 0.25);
      border-top-color: #e9d58f;
      border-radius: 50%;
      animation: ts-spin 0.9s linear infinite;
    }
    #ts-loading .hint { font-size: 13px; opacity: 0; transition: opacity 0.4s; }
    #ts-loading .hint.show { opacity: 0.75; }
    @keyframes ts-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ts-loading" role="status" aria-live="polite">
    <div class="title">TileSense</div>
    <div class="spinner"></div>
    <div class="hint" id="ts-loading-hint">Still loading&hellip; if this stays here, try reloading the page.</div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('ts-loading');
      var hint = document.getElementById('ts-loading-hint');
      var slow = setTimeout(function () { hint.className = 'hint show'; }, 12000);
      function hide() {
        clearTimeout(slow);
        el.className = 'done';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
