name: tilesense
description: >-
  A touch-first Flutter port of TileSense's 2D tile-efficiency trainer:
  offline singleplayer vs bots with a live shanten / ukeire guide and a
  defensive safety panel.
publish_to: none
version: 0.2.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  audioplayers: ^6.8.1
  web: ^1.1.0
  web_socket_channel: ^3.0.1
  mahjong_core:
    path: ../packages/mahjong_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tilesense.png
    - assets/clefairy.png
    - assets/TileClink.wav
    - assets/tiles/
    - assets/sfx/
    - assets/orderic/
    - assets/grant/
    - assets/hubert/
    - assets/astaroth/
    - assets/eric/
    - assets/erika/
    - assets/melissa/
    - assets/matityahu/
    - assets/sherman/
    - assets/saeko/
