name: tilesense
description: >-
  Hong Kong mahjong with a zero-faan minimum, flowers and seasons,
  offline opponents, and a live tile-efficiency and chip-value guide.
publish_to: none
version: 0.2.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  audioplayers: ^6.8.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tilesense.png
    - assets/clefairy.png
    - assets/tiles/
    - assets/sfx/
    - assets/orderic/
    - assets/grant/
    - assets/hubert/
    - assets/astaroth/
